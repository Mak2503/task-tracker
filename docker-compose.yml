services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: taskmaster-local
      MINIO_ROOT_PASSWORD: taskmaster-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    command: ["mb", "--ignore-existing", "local/taskmaster"]
    environment:
      MC_HOST_local: http://taskmaster-local:taskmaster-local-secret@minio:9000
    restart: on-failure:10

volumes:
  minio-data:
